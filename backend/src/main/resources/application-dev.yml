# =====================================================================
#  开发环境覆盖配置
#  生产环境请用 application-prod.yml，并且所有敏感项走环境变量注入
# =====================================================================

spring:
  # 首次启动时自动执行 schema.sql 建表。
  # 因为表都带 DROP TABLE IF EXISTS，误开这个开关会清空数据，只在开发期使用
  sql:
    init:
      mode: never

  datasource:
    # 口令不写兜底值：没有默认值时 Spring 会在启动阶段直接抛
    # "Could not resolve placeholder 'XK_MYSQL_PASSWORD'" 而快速失败，
    # 这比留一个公开的默认口令（等同把开发库口令写进仓库）安全得多。
    # 启动前先设好同名环境变量，取值与 .env 的 MYSQL_ROOT_PASSWORD 保持一致。
    password: ${XK_MYSQL_PASSWORD}

logging:
  level:
    com.xiaoku: debug
    org.springframework.kafka: info
    org.apache.kafka.clients: warn
    # 开发期把 ES 的请求日志打开，方便 P7 调搜索同步
    co.elastic.clients: info

xiaoku:
  jwt:
    # 仅本地开发用的弱密钥，上线必须换掉
    secret: dev_only_secret_key_please_change_me_before_production_2026
