# =====================================================================
#  开发环境覆盖配置
#  生产环境请用 application-prod.yml，并且所有敏感项走环境变量注入
# =====================================================================

spring:
  # 首次启动时自动执行 schema.sql 建表。
  # 因为表都带 DROP TABLE IF EXISTS，误开这个开关会清空数据，只在开发期使用
  sql:
    init:
      mode: never

  datasource:
    # 口令不写兜底值，避免"默认值 = 公开的开发库口令"。
    # 启动前先设好同名环境变量，取值与 .env 的 MYSQL_ROOT_PASSWORD 保持一致。
    #
    # 实测（2026-09-27，dev profile + 去掉 application.yml 的空串兜底后逐个试过）：
    #   变量未设置 -> 启动失败，报 "Access denied for user 'root'@'172.20.0.1'"
    #   变量为空串 -> 同上
    #   变量正确   -> 正常启动
    # 全程**没有**出现 "Could not resolve placeholder 'XK_MYSQL_PASSWORD'"，
    # 即未解析的占位符在属性绑定阶段被当作空值放过了。
    # 安全目标（绝不带着默认口令把服务起起来）达到了，但报错信息指向
    # "口令不对"而不是"口令没配"，第一次排查时很容易误判成口令写错。
    # 自检：启动前先 `echo $env:XK_MYSQL_PASSWORD` 确认非空，比看日志快。
    password: ${XK_MYSQL_PASSWORD}

logging:
  level:
    com.xiaoku: debug
    org.springframework.kafka: info
    org.apache.kafka.clients: warn
    # 开发期把 ES 的请求日志打开，方便 P7 调搜索同步
    co.elastic.clients: info

xiaoku:
  jwt:
    # 仅本地开发用的弱密钥，上线必须换掉
    secret: dev_only_secret_key_please_change_me_before_production_2026
