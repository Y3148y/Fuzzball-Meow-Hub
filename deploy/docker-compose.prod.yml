# =====================================================================
#  毛球喵社 —— 生产全栈编排
#  用法：
#    cp .env.prod.example .env.prod   # 填好口令/密钥
#    docker compose -f deploy/docker-compose.prod.yml --env-file .env.prod up -d --build
#
#  与开发用 docker-compose.yml 的区别：
#    - 全栈自包含：MySQL / Redis / Kafka / ES / 后端 / 前端 全部在同一网络里
#    - 服务间走 compose 内网名，不向局域网暴露端口（唯一出口是前端 80）
#    - 后端进容器跑 XK_PROFILE=prod
#    - 关键服务带 healthcheck，后端 / 前端用 depends_on 等健康再启动
#
#  部署一台机器：改 .env.prod 里的变量即可；扩并发改后端的
#  XK_SERVER_PORT 端口映射与 compose 的 replicas 需要配合 Nginx LB，超出本文件范围。
# =====================================================================
name: xiaoku-prod

services:
  # ---------------------------------------------------------
  # MySQL —— 数据卷持久化，首次启动自动执行 sql/schema.sql
  # ---------------------------------------------------------
  mysql:
    image: ${REGISTRY_PREFIX}mysql:8.4
    restart: unless-stopped
    # 生产不暴露端口：只有同网络的后端需要访问
    expose:
      - "3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?未设置 MYSQL_ROOT_PASSWORD，生产环境口令必填}
      MYSQL_DATABASE: xiaoku_db
      MYSQL_LOG_BIN: "0"
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --default-time-zone=+08:00
      - --max-connections=300
    volumes:
      - mysql-data:/var/lib/mysql
      - ../sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    networks:
      - xiaoku-net

  # ---------------------------------------------------------
  # Redis —— 计数权威 / 限流 / 幂等 / 布隆 / 锁，都在这一个实例上
  # ---------------------------------------------------------
  redis:
    image: ${REGISTRY_PREFIX}redis:7-alpine
    restart: unless-stopped
    expose:
      - "6379"
    # 需要连口令的话：command: ["redis-server","--requirepass","$${REDIS_PASSWORD}"]
    # 并在 .env.prod 提供 REDIS_PASSWORD；后端侧 XK_REDIS_PASSWORD 同步填
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - xiaoku-net

  # ---------------------------------------------------------
  # Kafka —— KRaft 单节点（同 dev 编排的参数与坑）
  # ---------------------------------------------------------
  kafka:
    image: ${REGISTRY_PREFIX}apache/kafka:3.9.2
    restart: unless-stopped
    expose:
      - "29092"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      # 容器内就一个监听 PLAINTEXT，advertised 指向同网络服务名 kafka
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"
      KAFKA_ALLOW_UNAUTHENTICATED_LOGIN: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    networks:
      - xiaoku-net

  # ---------------------------------------------------------
  # Elasticsearch —— 单节点，关闭安全认证（与后端配置保持一致）
  # ---------------------------------------------------------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.6
    restart: unless-stopped
    expose:
      - "9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.enrollment.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 40s
    networks:
      - xiaoku-net

  # ---------------------------------------------------------
  # 后端 —— XK_PROFILE=prod，所有连接串都指同网络服务名
  # ---------------------------------------------------------
  backend:
    build:
      context: ../backend
      args:
        REGISTRY_PREFIX: ${REGISTRY_PREFIX}
    image: xiaoku-backend:latest
    restart: unless-stopped
    expose:
      - "8088"
    environment:
      XK_PROFILE: prod
      XK_SERVER_PORT: ${XK_SERVER_PORT:-8088}
      XK_MYSQL_HOST: mysql
      XK_MYSQL_PORT: "3306"
      XK_MYSQL_DB: xiaoku_db
      XK_MYSQL_USER: root
      XK_MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:?生产库口令必填，不要复用开发口令}
      XK_REDIS_HOST: redis
      XK_REDIS_PORT: "6379"
      XK_REDIS_DB: ${XK_REDIS_DB:-3}
      XK_KAFKA_SERVERS: kafka:29092
      XK_ES_URIS: http://elasticsearch:9200
      XK_JWT_SECRET: ${XK_JWT_SECRET:?XK_JWT_SECRET 必填，使用 openssl rand -base64 64 生成}
      XK_MACHINE_ID: ${XK_MACHINE_ID:-1}
      XK_INIT_DEMO_DATA: "false"
      XK_STORAGE_TYPE: ${XK_STORAGE_TYPE:-local}
      XK_LOG_FILE: /app/logs/xiaoku-backend.log
      TZ: Asia/Shanghai
    volumes:
      # 本地盘图片持久化；仓库不提交 uploads
      - uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8088/api/system/ping || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - xiaoku-net
    # 多后端实例：把这里复制一份并保证 XK_MACHINE_ID 互不相同；
    # 前端 nginx 目前单点反代 backend，多实例需要在上游加负载均衡

  # ---------------------------------------------------------
  # 前端 —— 唯一对外出口（80）
  # ---------------------------------------------------------
  frontend:
    build:
      context: ../frontend
      args:
        REGISTRY_PREFIX: ${REGISTRY_PREFIX}
    image: xiaoku-frontend:latest
    restart: unless-stopped
    ports:
      # 对外只暴露这一个端口；改 80 被占时在 .env.prod 里设 XK_WEB_PORT
      - "${XK_WEB_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - xiaoku-net

volumes:
  mysql-data:
  redis-data:
  kafka-data:
  es-data:
  uploads:

networks:
  xiaoku-net:
    name: xiaoku-prod-net
    driver: bridge