<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      viewport-fit=cover 让内容延伸到 iPhone 刘海区域，配合 Vant 的 safe-area-inset-bottom
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f4f6fb" />
    <meta name="description" content="毛球喵社 Fuzzball-Meow-Hub —— 笔记社区，个人学习项目" />
    <title>毛球喵社 Fuzzball-Meow-Hub</title>
    <script>
      // 首屏防闪烁：必须在 Vue 挂载前把主题打上，否则暗色用户会先闪一帧白底。
      // 逻辑刻意与 src/composables/useTheme.ts 保持一致，但压缩到最小 ——
      // 这段代码要内联进 HTML，不能依赖模块。
      ;(function () {
        try {
          var saved = localStorage.getItem('xk_theme')
          var dark =
            saved === 'dark' ||
            (saved !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          var theme = dark ? 'dark' : 'light'
          var root = document.documentElement
          root.dataset.theme = theme
          if (dark) root.classList.add('van-theme-dark')
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', dark ? '#444a71' : '#f4f6fb')
        } catch (e) {
          // localStorage 在隐私模式下可能抛错，忽略即可，回落到浅色
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
