# =====================================================================
#  毛球喵社 —— 前端 Nginx 配置
#  同一份配置同时解决两件事：
#   1. SPA 路由回退：用户直接刷新 /note/xxx 时把请求交给 index.html
#   2. /api 与 /static 反代到后端服务想（compose 内服务名 backend）
# 图片 /static/uploads 走 nginx 代理而不是让浏览器直连后端：
# 生产只有 80 一个出口，后端不出网。
# =====================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ⚠️ **这里曾经是 100m，而其它两层是 200MB** —— 三层不一致，导致
    #    100~200MB 的文件「过了前端预检、过了后端」，却被 nginx 一个 413 打回。
    #    更糟的是 nginx 返回的是 **HTML** 错误页而不是 JSON，
    #    request.ts 的响应拦截器拿不到业务码，用户看到的是 axios 的原始报错
    #    （"Request failed with status code 413"），完全不知道是文件太大。
    #
    #    nginx 默认是 1m，所以这行**不能删**，必须显式写；它必须 ≥ 后端的
    #    max-request-size，否则 nginx 永远先一步拒绝。
    #
    #    现状：后端 max-file-size 200MB / max-request-size 210MB
    #    （210 是给 multipart 边界与表单字段留的余量）。
    client_max_body_size 210m;

    charset utf-8;

    # ---------- API 反代 ----------
    location /api/ {
        proxy_pass http://backend:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }

    # ---------- 后端本地盘图片 ----------
    location /static/ {
        proxy_pass http://backend:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 图片这类大响应可以更久一点
        proxy_read_timeout 120s;
    }

    # ---------- 静态资源（带 hash 的产物长缓存） ----------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---------- SPA 回退 ----------
    location / {
        try_files $uri $uri/ /index.html;
    }
}