# =====================================================================
#  毛球喵社 —— 前端 Nginx 配置
#  同一份配置同时解决两件事：
#   1. SPA 路由回退：用户直接刷新 /note/xxx 时把请求交给 index.html
#   2. /api 与 /static 反代到后端服务想（compose 内服务名 backend）
# 图片 /static/uploads 走 nginx 代理而不是让浏览器直连后端：
# 生产只有 80 一个出口，后端不出网。
# =====================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 后端允许 20MB 单请求、100MB 单次上传，nginx 默认 client_max_body_size 1M 会 413
    client_max_body_size 100m;

    charset utf-8;

    # ---------- API 反代 ----------
    location /api/ {
        proxy_pass http://backend:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }

    # ---------- 后端本地盘图片 ----------
    location /static/ {
        proxy_pass http://backend:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 图片这类大响应可以更久一点
        proxy_read_timeout 120s;
    }

    # ---------- 静态资源（带 hash 的产物长缓存） ----------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---------- SPA 回退 ----------
    location / {
        try_files $uri $uri/ /index.html;
    }
}